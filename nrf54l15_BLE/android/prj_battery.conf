# Battery-optimized config for Android firmware (nRF54L15 XIAO).
# Build: west build -b xiao_nrf54l15/nrf54l15/cpuapp -- -DCONF_FILE=prj_battery.conf
#
# Biggest savings come from disabling UART console + logging.
#
# NOTE: main.c uses k_busy_wait() in the ADC loop, which pins the CPU at
# 100% between BLE events. For real battery life, replace k_busy_wait
# with k_sleep(K_USEC(...)) or a timer. This config still kills the UART
# drain (~1-2 mA) on its own.

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WYATT nRF54"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_BUF_ACL_TX_SIZE=104
CONFIG_BT_BUF_ACL_RX_SIZE=104
CONFIG_BT_GATT_CLIENT=y

# Prefer longer connection intervals so the radio idles more.
# Units are 1.25 ms.
# 24 = 30 ms, 40 = 50 ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Supervision timeout in 10 ms units — 400 = 4 s
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ADC
CONFIG_ADC=y

# Tickless kernel — lets MCU sleep when idle (already default; explicit here)
CONFIG_TICKLESS_KERNEL=y

# --- Kill UART / console / serial stack (biggest single saving) ---
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# --- Kill logging backend (relies on UART anyway) ---
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Smaller stacks since logging is gone
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
