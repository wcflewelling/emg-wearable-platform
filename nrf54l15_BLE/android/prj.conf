CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WYATT nRF54"
CONFIG_BT_DEVICE_APPEARANCE=0
# Larger MTU to carry 36-byte ADC batches (BATCH_SIZE=8).
# 100 B payload is comfortably above the 39 B minimum.
CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_BUF_ACL_TX_SIZE=104
CONFIG_BT_BUF_ACL_RX_SIZE=104
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y